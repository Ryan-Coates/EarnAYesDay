<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your tasks and earn a Yes Day!">
  <title>Earn A Yes Day! 🎉</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/child.css">
</head>
<body>

  <!-- Confetti canvas (sits behind celebration overlay) -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <!-- ── Celebration overlay ──────────────────────── -->
  <div id="celebration-overlay" class="celebration-overlay hidden" role="dialog" aria-modal="true" aria-label="Celebration">
    <span class="celebration-emoji">🎉</span>
    <h1 class="celebration-title">YES DAY!!!</h1>
    <p class="celebration-sub">You've earned it — you absolute LEGEND!</p>
    <button class="btn btn-primary" onclick="dismissCelebration()">
      Let's GOOOO! 🚀
    </button>
  </div>

  <!-- ── Undo toast ────────────────────────────────── -->
  <div id="undo-toast" class="undo-toast hidden" role="status" aria-live="polite">
    <span id="undo-message">Done!</span>
    <button class="undo-btn" onclick="handleUndo()">↩ Undo</button>
  </div>

  <!-- ── Main content ──────────────────────────────── -->
  <div class="child-container">

    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title">⭐ Earn A Yes Day! ⭐</h1>
    </header>

    <!-- Countdown card -->
    <div class="card countdown-card">
      <span id="countdown-number" class="countdown-number">…</span>
      <div id="countdown-label" class="countdown-label">Loading…</div>
      <div id="countdown-date"  class="countdown-date"></div>
    </div>

    <!-- Overall progress -->
    <div id="progress-card" class="card overall-progress" style="display:none;">
      <div class="progress-header">
        <span id="progress-text">Loading…</span>
        <span>🏆</span>
      </div>
      <div class="progress-bar-track">
        <div id="progress-fill" class="progress-bar-fill" style="width:0%"></div>
        <span id="progress-pct" class="progress-pct">0%</span>
      </div>
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="empty-state" style="display:none;">
      <span class="emoji">🤔</span>
      <p>No tasks yet!<br>Ask your parent to set some up.</p>
    </div>

    <!-- Positive tasks -->
    <section id="positive-section" style="display:none;">
      <h2 class="section-title">⭐ Earn it!</h2>
      <div id="positive-tasks"></div>
    </section>

    <!-- Negative tasks -->
    <section id="negative-section" style="display:none;">
      <h2 class="section-title">� Don't do it!</h2>
      <div id="negative-tasks"></div>
    </section>

    <!-- Admin link -->
    <div class="admin-link-bar">
      <a href="admin.html">⚙️ Parent Admin</a>
    </div>

  </div><!-- /child-container -->

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/child.js"></script>
</body>
</html>
